resources:
  jobs:
    dimensiones:
      name: dimensiones
      description: Nomenclatura DIVIPOLA, traducción de áreas GEIH a municipio y dominios ciudad / ciudad A.M. (tesis.dim).
      max_concurrent_runs: 1
      environments:
        - environment_key: serverless
          spec:
            environment_version: "2"
      tasks:
        - task_key: dim_divipola
          environment_key: serverless
          notebook_task:
            notebook_path: ../../code/ingesta_datos/dimensiones/dim_divipola.py
        # R-24: las capitales salen de dim_dominio_geih
        - task_key: dim_geih_divipola
          depends_on:
            - task_key: dim_divipola
            - task_key: dim_dominio_geih
          environment_key: serverless
          notebook_task:
            notebook_path: ../../code/ingesta_datos/dimensiones/dim_geih_divipola.py
        - task_key: dim_dominio_geih
          depends_on:
            - task_key: dim_divipola
          environment_key: serverless
          notebook_task:
            notebook_path: ../../code/ingesta_datos/dimensiones/dim_dominio_geih.py
