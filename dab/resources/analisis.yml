resources:
  jobs:
    analisis:
      name: analisis
      description: >-
        Análisis descriptivo y EDA de selección de covariables. Las figuras se guardan en
        /Volumes/tesis/preprocesamiento/figuras_eda, que debe existir (el bundle no crea volúmenes).
      max_concurrent_runs: 1
      # Entorno serverless 2 (verificado 2026-10-27): Python 3.11.10, numpy 1.23.5, scipy 1.11.1,
      # pandas 1.5.3, statsmodels 0.14.0, matplotlib 3.7.2. Vienen en el entorno base; ver requirements.txt (R-50).
      environments:
        - environment_key: serverless
          spec:
            environment_version: "2"
      tasks:
        - task_key: analisis_descriptivo
          environment_key: serverless
          notebook_task:
            notebook_path: ../../code/analisis/analisis_descriptivo.py
        - task_key: eda_seleccion_covariables
          depends_on:
            - task_key: analisis_descriptivo
          environment_key: serverless
          notebook_task:
            notebook_path: ../../code/analisis/eda_seleccion_covariables.py
        # R-37: code/analisis/sensibilidad_ventana_temporal.py (G7-B2) ya no corre en el job. Sus
        # tablas (sensibilidad_ventana_temporal, resumen_ventana_temporal y
        # validacion_anual_totales) quedan como evidencia de la decisión de la ventana anual;
        # para regenerarlas se ejecuta el notebook a mano.
