resources:
  jobs:
    ingesta_terridata:
      name: ingesta_terridata
      description: TerriData (bronce → plata ancha + dim_indicadores).
      max_concurrent_runs: 1
      # Entorno serverless 2 (verificado 2026-10-27): Python 3.11.10, numpy 1.23.5, scipy 1.11.1,
      # pandas 1.5.3, statsmodels 0.14.0, matplotlib 3.7.2. Vienen en el entorno base; ver requirements.txt (R-50).
      environments:
        - environment_key: serverless
          spec:
            environment_version: "2"
      tasks:
        - task_key: terridata_bronce
          environment_key: serverless
          notebook_task:
            notebook_path: ../../code/ingesta_datos/terridata/terridata_bronce.py
        - task_key: terridata_plata
          depends_on:
            - task_key: terridata_bronce
          environment_key: serverless
          notebook_task:
            notebook_path: ../../code/ingesta_datos/terridata/terridata_plata.py
