resources:
  jobs:
    ingesta_geih:
      name: ingesta_geih
      description: GEIH medallón (bronce → plata → oro) y datos publicados DANE. Requiere que dimensiones ya se haya ejecutado.
      max_concurrent_runs: 1
      # Entorno serverless 2 (verificado 2026-10-27): Python 3.11.10, numpy 1.23.5, scipy 1.11.1,
      # pandas 1.5.3, statsmodels 0.14.0, matplotlib 3.7.2. Vienen en el entorno base; ver requirements.txt (R-50).
      environments:
        - environment_key: serverless
          spec:
            environment_version: "2"
        # openpyxl no viene en el entorno serverless; lo necesita pandas.read_excel. Versión fija (R-50):
        # 3.1.5 es compatible con pandas 1.5.3 del entorno 2.
        - environment_key: serverless_excel
          spec:
            environment_version: "2"
            dependencies:
              - openpyxl==3.1.5
      tasks:
        - task_key: geih_bronce
          environment_key: serverless
          notebook_task:
            notebook_path: ../../code/ingesta_datos/geih/geih_bronce.py
        - task_key: geih_plata
          depends_on:
            - task_key: geih_bronce
          environment_key: serverless
          notebook_task:
            notebook_path: ../../code/ingesta_datos/geih/geih_plata.py
        - task_key: geih_oro
          depends_on:
            - task_key: geih_plata
          environment_key: serverless
          notebook_task:
            notebook_path: ../../code/ingesta_datos/geih/geih_oro.py
        - task_key: datos_publicados
          environment_key: serverless_excel
          notebook_task:
            notebook_path: ../../code/ingesta_datos/geih/datos_publicados.py
