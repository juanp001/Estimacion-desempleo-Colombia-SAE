resources:
  jobs:
    modelo:
      name: modelo
      description: >-
        Modelo Fay-Herriot clásico, benchmark no espacial (EBLUP, predicción sintética y tabla final
        preliminar en tesis.modelo, R-11), su variante espacial SEBLUP y sensibilidad a la varianza de
        muestreo ψ_d con GVF (G7-B3, independiente).
      max_concurrent_runs: 1
      # Entorno serverless 2 (verificado 2026-10-27): Python 3.11.10, numpy 1.23.5, scipy 1.11.1,
      # pandas 1.5.3, statsmodels 0.14.0, matplotlib 3.7.2. Vienen en el entorno base; ver requirements.txt (R-50).
      environments:
        - environment_key: serverless
          spec:
            environment_version: "2"
      tasks:
        - task_key: fay_herriot
          environment_key: serverless
          notebook_task:
            notebook_path: ../../code/modelo/fay_herriot.py
        - task_key: sensibilidad_varianza
          environment_key: serverless
          notebook_task:
            notebook_path: ../../code/modelo/sensibilidad_varianza.py
        - task_key: fay_herriot_espacial
          depends_on:
            - task_key: fay_herriot
          environment_key: serverless
          notebook_task:
            notebook_path: ../../code/modelo/fay_herriot_espacial.py
