# Declarative Automation Bundle de Estimacion-desempleo-Colombia-SAE.
# Los jobs viven en dab/resources/ y los targets en dab/targets/.
# Documentación: https://docs.databricks.com/dev-tools/bundles/index.html

bundle:
  name: Estimacion-desempleo-Colombia-SAE

include:
  - dab/resources/*.yml
  - dab/targets/*.yml

variables:
  # Ventana de tiempo de la estimación (la leen estimacion_directa y dominios_sin_encuesta).
  # Se cambia aquí o al ejecutar:
  #   databricks bundle run preprocesamiento -t dev --params anio_estimacion=2024,mes_estimacion=6
  anio_estimacion:
    description: Año (PER) del período a estimar
    default: "2018"
  mes_estimacion:
    description: Mes (1-12) del período a estimar
    default: "12"

sync:
  exclude:
    - data/**
    - code/ingesta_datos/censo_nal/**
    - code/analisis/renombrar_geih.py
