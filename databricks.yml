# Declarative Automation Bundle de Estimacion-desempleo-Colombia-SAE.
# Los jobs viven en dab/resources/ y los targets en dab/targets/.
# Documentación: https://docs.databricks.com/dev-tools/bundles/index.html

bundle:
  name: Estimacion-desempleo-Colombia-SAE

include:
  - dab/resources/*.yml
  - dab/targets/*.yml

variables:
  # Ventana de tiempo de la estimación (la leen estimacion_directa y dominios_sin_encuesta).
  # Por defecto el año calendario 2018 (12 meses con cierre en diciembre, G7-B2). Se cambia aquí
  # o al ejecutar, p. ej. el trimestre móvil Abr-Jun 2024:
  #   databricks bundle run preprocesamiento -t dev --params anio_estimacion=2024,mes_estimacion=6,n_meses_ventana=3
  anio_estimacion:
    description: Año (PER) del período a estimar
    default: "2018"
  mes_estimacion:
    description: Mes (1-12) de cierre del período a estimar
    default: "12"
  n_meses_ventana:
    description: Meses de la ventana (12 = año, exige cierre en diciembre; 3 = trimestre móvil)
    default: "12"

sync:
  exclude:
    - data/**
    - code/ingesta_datos/censo_nal/**
    - code/analisis/renombrar_geih.py
    # Archivos de trabajo sueltos en la raíz (insumos y documentos, p. ej. TerriData.txt de
    # ~3 GB): no son código de los jobs y superan el tamaño máximo de un archivo del workspace.
    - "*.txt"
    - "*.xlsx"
    - "*.pdf"
